name: Research
description: Find out before building; ends in a note and filed issues.
labels: [research]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: "What must be decided, why now, and what to read or measure. Record versions and dates."
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The observable checks that close this issue.
      value: |
        - Note with sources and numbers.
        - Decision recorded in the design docs.
        - Implementation issues filed with Depends on.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "One line each. Depends on: issues that must close first (#n, or other-repo#n), or none. Size: S (about a day), M (a few days) or L (a week or more). Runner: dsh (tiny code change), grok-cursor (medium single-area change), agy (docs and wording) or omo (large, multi-area, device or research work); leave it empty on a parent issue. Add Part of #n and any links that help."
      value: |
        - Depends on: none
        - Size:
        - Runner:
    validations:
      required: true
