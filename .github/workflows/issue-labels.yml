name: Issue labels

# Called by lina, lina-app and lina-os (.github/workflows/labels.yml in each), each pinned to one commit SHA
# of this repository in `uses:` and in `rules_ref` (bump both together after a reviewed change here). Runs with the
# caller's GITHUB_TOKEN, which needs issues: write; the rules are scripts/issue_labels.py here.
# An issues event judges that issue; a schedule or manual run also matches the label
# definitions to labels.yml and judges every open issue again.

on:
  workflow_call:
    inputs:
      rules_ref:
        description: Full commit SHA of lina-system/.github to take the rules from; the same SHA the caller pins in `uses:`.
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  labels:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: issue-labels-${{ github.repository }}-${{ github.event.issue.number || 'all' }}
      cancel-in-progress: false
    steps:
      - name: Check the pinned rules commit
        env:
          RULES_REF: ${{ inputs.rules_ref }}
        run: |
          if ! printf '%s' "$RULES_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "rules_ref must be a full commit SHA of lina-system/.github, got: $RULES_REF" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lina-system/.github
          ref: ${{ inputs.rules_ref }}
          path: org
          persist-credentials: false
          sparse-checkout: |
            scripts/issue_labels.py
            labels.yml
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Match labels to labels.yml
        if: github.event_name != 'issues'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.3
          python org/scripts/issue_labels.py sync

      - name: Judge size and runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = issues ]; then
            python org/scripts/issue_labels.py issues --issue "$ISSUE"
          else
            python org/scripts/issue_labels.py issues
          fi
